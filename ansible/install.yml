---
- name: Install School Bell
  hosts: all
  vars:
    school_bell_user: pi
    school_bell_repository: https://github.com/psmsmets/school-bell.git
    school_bell_version: main
    school_bell_config_name: schema.json
    school_bell_config_src: files/schema.json
    school_bell_debug: false
    school_bell_test: false

  pre_tasks:
    - name: Read School Bell user account
      ansible.builtin.getent:
        database: passwd
        key: "{{ school_bell_user }}"

    - name: Determine School Bell primary group
      ansible.builtin.command:
        argv:
          - id
          - -gn
          - "{{ school_bell_user }}"
      register: school_bell_primary_group
      changed_when: false

    - name: Determine School Bell paths
      ansible.builtin.set_fact:
        school_bell_home: "{{ ansible_facts.getent_passwd[school_bell_user][4] }}"
        school_bell_group: "{{ school_bell_primary_group.stdout }}"
        school_bell_config_path: >-
          {{ ansible_facts.getent_passwd[school_bell_user][4] }}/{{ school_bell_config_name }}

  tasks:
    - name: Install git
      become: true
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Verify Python virtual environment exists
      ansible.builtin.stat:
        path: "{{ school_bell_home }}/.local/bin/python"
      register: school_bell_venv

    - name: Require initialized Python virtual environment
      ansible.builtin.assert:
        that: school_bell_venv.stat.executable | default(false)
        fail_msg: Run ansible/init.yml for this host before installing School Bell.

    - name: Install School Bell in virtual environment
      become: true
      become_user: "{{ school_bell_user }}"
      ansible.builtin.pip:
        name: "git+{{ school_bell_repository }}@{{ school_bell_version }}"
        state: present
        virtualenv: "{{ school_bell_home }}/.local"
      notify: Restart School Bell

    - name: Install demo audio samples
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../samples/"
        dest: "{{ school_bell_home }}/samples/"
        owner: "{{ school_bell_user }}"
        group: "{{ school_bell_group }}"
        mode: "0644"
        directory_mode: "0755"
      notify: Restart School Bell

    - name: Install School Bell configuration
      become: true
      ansible.builtin.copy:
        src: "{{ school_bell_config_src }}"
        dest: "{{ school_bell_config_path }}"
        owner: "{{ school_bell_user }}"
        group: "{{ school_bell_group }}"
        mode: "0644"
      notify: Restart School Bell

    - name: Check School Bell configuration
      ansible.builtin.stat:
        path: "{{ school_bell_config_path }}"
      register: school_bell_config

    - name: Require School Bell configuration
      ansible.builtin.assert:
        that: school_bell_config.stat.isreg | default(false)
        fail_msg: >-
          Configuration {{ school_bell_config_path }} could not be installed.

    - name: Install School Bell systemd unit
      become: true
      ansible.builtin.template:
        src: templates/school-bell.service.j2
        dest: /etc/systemd/system/school-bell.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart School Bell

    - name: Apply systemd unit changes before starting service
      ansible.builtin.meta: flush_handlers

    - name: Enable and start School Bell
      become: true
      ansible.builtin.systemd_service:
        name: school-bell
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart School Bell
      become: true
      ansible.builtin.systemd_service:
        name: school-bell
        state: restarted
