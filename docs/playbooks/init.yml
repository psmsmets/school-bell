---
- name: Configure a Raspberry Pi with Raspberry Pi OS lite 64bit from scratch
  hosts: all

  tasks:
    - name: Upgrade existing packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600
      become: yes

    - name: Install core packages
      apt:
        name:
          - git
          - wget
          - vim
          - build-essential
          - checkinstall
        state: present
      become: yes

    - name: Configure vim
      blockinfile:
        dest: "{{ ansible_env.HOME }}/.vimrc"
        block: |
          filetype plugin indent off
          syntax on
          set term=builtin_xterm
          set term=xterm-256color
          set number
          set mouse=r
        create: yes

    - name: Run raspi-config commands
      shell: |
        raspi-config nonint do_memory_split 16
        raspi-config --expand-rootfs
      become: yes

    - name: Install Python core packages (apt)
      apt:
        name:
          - libssl-dev
          - libffi-dev
          - python3
          - python3-pip
          - python3-dev
          - python3-venv
          - python3-setuptools
          - python3-numpy
          - python3-gpiozero
          - python3-serial
        state: present
      become: yes

    - name: Create Python virtual environment
      command:
        cmd: python3 -m venv --clear --prompt py3 {{ ansible_env.HOME }}/.local
        creates: "{{ ansible_env.HOME }}/.local"

    - name: Upgrade pip and install related packages in virtual environment
      pip:
        name:
          - pip
          - setuptools
          - setuptools_scm
          - wheel
        state: latest
        virtualenv: "{{ ansible_env.HOME }}/.local"

    - name: Add aliases and Python venv activation to .bashrc
      blockinfile:
        dest: "{{ ansible_env.HOME }}/.bashrc"
        block: |
          # aliases
          alias ls='ls -h --color=auto'
          alias ll='ls -lh'
          alias la='ls -lha'
          # activate python venv
          source $HOME/.local/bin/activate
        marker: '# {mark} ANSIBLE MANAGED BLOCK'
        prepend_newline: true

    - name: Reboot RPi (Waiting for 1.5 min)
      reboot:
        msg: "Rebooting machine in 5 seconds"
        reboot_timeout: 90
      become: true
