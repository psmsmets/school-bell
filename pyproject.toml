[build-system]
requires = [
    "setuptools>=61",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "school-bell"
dynamic = ["version"]
description = "Python scheduled ringing of the school bell"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Pieter Smets", email = "mail@pietersmets.be" },
]
maintainers = [
    { name = "Pieter Smets", email = "mail@pietersmets.be" },
]
keywords = ["unix", "automation", "bell", "gpio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "gpiozero>=1.6",
    "lgpio>=0.2.2.0; sys_platform == 'linux' and python_version < '3.13' and platform_machine == 'aarch64'",
    "lgpio>=0.2.2.0; sys_platform == 'linux' and python_version < '3.13' and platform_machine == 'armv7l'",
    "adafruit-lgpio>=0.2.2.0; sys_platform == 'linux' and python_version >= '3.13' and platform_machine == 'aarch64'",
    "adafruit-lgpio>=0.2.2.0; sys_platform == 'linux' and python_version >= '3.13' and platform_machine == 'armv7l'",
    "requests>=2.20",
    "schedule>=1.2.0",
    "pytz>=2021.1",
    "icalendar>=6,<8",
    "recurring-ical-events>=3,<4",
]

[project.urls]
Homepage = "https://github.com/psmsmets/school-bell"
Source = "https://github.com/psmsmets/school-bell"
Tracker = "https://github.com/psmsmets/school-bell/issues"

[project.scripts]
school-bell = "school_bell.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store", ".ipynb_checkpoints/*", "__pycache__/*", "*.py[cod]"]

[tool.setuptools.data-files]
"share/school-bell" = ["demo.json", "demo.service"]

[tool.setuptools_scm]
write_to = "src/school_bell/version.py"
git_describe_command = "git describe --dirty --tags --long --match v* --first-parent"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flake8]
max-line-length = 127
max-complexity = 10
hang-closing = true
ignore = [
    "E121",
    "E123",
    "E126",
    "E133",
    "E24",
    "E226",
    "E402",
    "E704",
    "W503",
    "W504",
    "W605",
]
exclude = [
    "*.egg-info",
    ".DS_Store",
    ".eggs",
    "*.swp",
    "build",
    "migrations",
]
